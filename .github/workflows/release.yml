name: Release (qualification gated)

# v4 publication must promote previously qualified, immutable A/B artifacts.
# That cross-run digest binding is intentionally not approximated here: until
# the Phase-7 promotion workflow exists, a release request fails before it can
# read signing credentials, create a tag/release, or publish to PyPI.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_AI_DISABLE_TELEMETRY: "true"

jobs:
  publication-gate:
    name: Refuse unqualified publication
    runs-on: ubuntu-latest
    steps:
      - name: Require exact qualified-artifact promotion
        shell: bash
        run: |
          echo "::error::v4 publication is disabled until immutable A/B qualification artifacts are bound to an approved promotion by run ID and digest."
          exit 1
